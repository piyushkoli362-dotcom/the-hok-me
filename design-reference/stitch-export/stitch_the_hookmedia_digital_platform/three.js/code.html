<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js interactive 3D hero sculpture for The HookMedia
// Chrome & glass sculptural orb with metallic faceted rings, lime particle vortex, and floating dimensional nodes

const width = container.clientWidth || window.innerWidth || 390;
const height = container.clientHeight || 450;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
camera.position.set(0, 0, 5.2);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const limeLight = new THREE.PointLight(0xc6ff4d, 5, 20);
limeLight.position.set(2.5, 3, 2.5);
scene.add(limeLight);

const cyanLight = new THREE.PointLight(0x00f0ff, 2.5, 15);
cyanLight.position.set(-3, -2, -2);
scene.add(cyanLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(1, 4, 3);
scene.add(dirLight);

// Group
const rootGroup = new THREE.Group();
scene.add(rootGroup);

// 1. Core Sculptural Icosahedron / Orb (Chrome Glass look)
const coreGeo = new THREE.IcosahedronGeometry(1.2, 3);
const coreMat = new THREE.MeshPhongMaterial({
  color: 0x1a2126,
  emissive: 0x051008,
  specular: 0xc6ff4d,
  shininess: 120,
  wireframe: false,
  flatShading: true,
  transparent: true,
  opacity: 0.92
});
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
rootGroup.add(coreMesh);

// Inner Glowing Wireframe Core
const innerGeo = new THREE.IcosahedronGeometry(0.85, 2);
const innerMat = new THREE.MeshBasicMaterial({
  color: 0xc6ff4d,
  wireframe: true,
  transparent: true,
  opacity: 0.35
});
const innerMesh = new THREE.Mesh(innerGeo, innerMat);
rootGroup.add(innerMesh);

// 2. Torus Orbital Ring 1
const ringGeo1 = new THREE.TorusGeometry(1.8, 0.028, 16, 100);
const ringMat1 = new THREE.MeshStandardMaterial({
  color: 0xc6ff4d,
  emissive: 0x6e991b,
  metalness: 0.8,
  roughness: 0.2
});
const ringMesh1 = new THREE.Mesh(ringGeo1, ringMat1);
ringMesh1.rotation.x = Math.PI / 3;
ringMesh1.rotation.y = Math.PI / 6;
rootGroup.add(ringMesh1);

// Torus Orbital Ring 2 (Perpendicular chrome ring)
const ringGeo2 = new THREE.TorusGeometry(2.1, 0.02, 16, 100);
const ringMat2 = new THREE.MeshStandardMaterial({
  color: 0x8a9ba8,
  metalness: 0.9,
  roughness: 0.1
});
const ringMesh2 = new THREE.Mesh(ringGeo2, ringMat2);
ringMesh2.rotation.x = -Math.PI / 4;
ringMesh2.rotation.y = Math.PI / 3;
rootGroup.add(ringMesh2);

// 3. Floating Kinetic Tech Nodes / Geometric Prisms
const nodeGeo = new THREE.BoxGeometry(0.18, 0.18, 0.18);
const nodeMat = new THREE.MeshStandardMaterial({
  color: 0xc6ff4d,
  metalness: 0.5,
  roughness: 0.2
});
const nodes = [];
const numNodes = 8;
for (let i = 0; i < numNodes; i++) {
  const mesh = new THREE.Mesh(nodeGeo, nodeMat);
  const angle = (i / numNodes) * Math.PI * 2;
  const radius = 1.9 + Math.sin(i * 1.5) * 0.4;
  mesh.position.set(
    Math.cos(angle) * radius,
    (Math.sin(i * 2.3) * 0.7),
    Math.sin(angle) * radius
  );
  rootGroup.add(mesh);
  nodes.push({ mesh, angle, speed: 0.015 + (i % 3) * 0.008, radius, yOffset: mesh.position.y });
}

// 4. Luminous Particle Dust / Swarm
const particleCount = 140;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  const r = 1.3 + Math.random() * 1.8;
  const theta = Math.random() * Math.PI * 2;
  const phi = (Math.random() - 0.5) * Math.PI;

  positions[i * 3] = r * Math.cos(phi) * Math.cos(theta);
  positions[i * 3 + 1] = r * Math.sin(phi);
  positions[i * 3 + 2] = r * Math.cos(phi) * Math.sin(theta);

  // Mix between electric lime (#C6FF4D: 0.77, 1.0, 0.3) and cool white
  if (Math.random() > 0.4) {
    colors[i * 3] = 0.77;
    colors[i * 3 + 1] = 1.0;
    colors[i * 3 + 2] = 0.3;
  } else {
    colors[i * 3] = 0.8;
    colors[i * 3 + 1] = 0.9;
    colors[i * 3 + 2] = 1.0;
  }
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.045,
  vertexColors: true,
  transparent: true,
  opacity: 0.85
});
const particleSystem = new THREE.Points(particleGeo, particleMat);
rootGroup.add(particleSystem);

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

function onPointerMove(e) {
  const rect = container.getBoundingClientRect();
  const clientX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
  mouseX = ((clientX - rect.left) / (rect.width || 1) - 0.5) * 2;
  mouseY = ((clientY - rect.top) / (rect.height || 1) - 0.5) * 2;
}

window.addEventListener('pointermove', onPointerMove, { passive: true });
window.addEventListener('touchmove', onPointerMove, { passive: true });

function handleResize() {
  const w = container.clientWidth || window.innerWidth || 390;
  const h = container.clientHeight || 450;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

// Animation Loop
let clock = new THREE.Clock();
let animId;

function animate() {
  animId = requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Smooth mouse damping
  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  rootGroup.rotation.y = elapsedTime * 0.35 + targetX * 0.6;
  rootGroup.rotation.x = Math.sin(elapsedTime * 0.25) * 0.2 + targetY * 0.4;
  rootGroup.position.y = Math.sin(elapsedTime * 1.2) * 0.12;

  coreMesh.rotation.y = -elapsedTime * 0.2;
  innerMesh.rotation.y = elapsedTime * 0.4;

  ringMesh1.rotation.z = elapsedTime * 0.25;
  ringMesh2.rotation.z = -elapsedTime * 0.18;

  particleSystem.rotation.y = elapsedTime * 0.1;

  nodes.forEach((n, idx) => {
    n.angle += n.speed;
    n.mesh.position.x = Math.cos(n.angle) * n.radius;
    n.mesh.position.z = Math.sin(n.angle) * n.radius;
    n.mesh.position.y = n.yOffset + Math.sin(elapsedTime * 2 + idx) * 0.15;
    n.mesh.rotation.x += 0.02;
    n.mesh.rotation.y += 0.03;
  });

  renderer.render(scene, camera);
}
animate();

// Cleanup on removal
return function dispose() {
  cancelAnimationFrame(animId);
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('touchmove', onPointerMove);
  window.removeEventListener('resize', handleResize);
  renderer.dispose();
  if (renderer.domElement && renderer.domElement.parentNode) {
    renderer.domElement.parentNode.removeChild(renderer.domElement);
  }
};

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
